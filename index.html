<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1565C0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="جون سعادة">
  <meta name="description" content="نظام محاسبة مؤسسة جون سعادة للجملة">
  <title>مؤسسة جون سعادة</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cashier.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="login-screen" class="login-screen">
    <div class="login-bg"></div>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">
          <div class="login-icon-wrap">🏪</div>
          <h1>مؤسسة جون سعادة</h1>
          <p>نظام المحاسبة للجملة</p>
        </div>
        <form id="login-form" autocomplete="on">
          <div class="field-group">
            <label>اسم المستخدم</label>
            <div class="field-icon-wrap">
              <span class="field-icon">👤</span>
              <input type="text" id="username" placeholder="أدخل اسم المستخدم"
                     autocomplete="username" spellcheck="false">
            </div>
          </div>
          <div class="field-group">
            <label>كلمة المرور</label>
            <div class="field-icon-wrap">
              <span class="field-icon">🔒</span>
              <input type="password" id="password" placeholder="أدخل كلمة المرور"
                     autocomplete="current-password">
              <button type="button" id="toggle-pw" class="toggle-pw-btn" tabindex="-1">👁</button>
            </div>
          </div>
          <div id="login-error" class="login-error hidden"></div>
          <button type="submit" class="login-btn">
            <span id="login-btn-text">دخول</span>
          </button>
        </form>
        <div class="login-footer">مؤسسة جون سعادة &copy; 2025</div>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN APP ==================== -->
  <div id="app" class="app hidden">

    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">ج س</div>
        <div class="brand-info">
          <span class="brand-name">جون سعادة</span>
          <span class="brand-sub">للجملة</span>
        </div>
        <button id="sidebar-close" class="sidebar-close-btn">✕</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">الرئيسية</div>
        <a href="#" class="nav-link active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-label">لوحة التحكم</span>
        </a>
        <a href="#" class="nav-link" data-page="cashier"
           style="background:rgba(255,143,0,.15);border:1px solid rgba(255,143,0,.3)">
          <span class="nav-icon">🧮</span>
          <span class="nav-label">الكاشير</span>
          <span class="nav-badge" style="background:var(--accent);font-size:9px">جديد</span>
        </a>

        <div class="nav-section-label">المعاملات</div>
        <a href="#" class="nav-link" data-page="sales">
          <span class="nav-icon">🧾</span>
          <span class="nav-label">المبيعات</span>
          <span class="nav-badge" id="badge-sales"></span>
        </a>
        <a href="#" class="nav-link" data-page="purchases">
          <span class="nav-icon">🛒</span>
          <span class="nav-label">المشتريات</span>
        </a>
        <a href="#" class="nav-link" data-page="expenses">
          <span class="nav-icon">💸</span>
          <span class="nav-label">المصاريف</span>
        </a>

        <div class="nav-section-label">الإدارة</div>
        <a href="#" class="nav-link" data-page="inventory">
          <span class="nav-icon">📦</span>
          <span class="nav-label">المخزون</span>
          <span class="nav-badge nav-badge-warn" id="badge-inventory"></span>
        </a>
        <a href="#" class="nav-link" data-page="customers">
          <span class="nav-icon">👥</span>
          <span class="nav-label">العملاء</span>
        </a>
        <a href="#" class="nav-link" data-page="suppliers">
          <span class="nav-icon">🏭</span>
          <span class="nav-label">الموردون</span>
        </a>

        <div class="nav-section-label">التحليل</div>
        <a href="#" class="nav-link" data-page="reports">
          <span class="nav-icon">📈</span>
          <span class="nav-label">التقارير</span>
        </a>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar-sm">👤</div>
        <div class="user-meta">
          <div class="user-name-sm">مدير النظام</div>
          <div class="user-role-sm">admin</div>
        </div>
        <button id="logout-btn" class="logout-btn" title="تسجيل خروج">🚪</button>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="main-area">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-start">
          <button id="menu-btn" class="menu-btn" aria-label="القائمة">
            <span></span><span></span><span></span>
          </button>
          <div class="topbar-title">
            <h2 id="page-title">لوحة التحكم</h2>
          </div>
        </div>
        <div class="topbar-end">
          <div class="topbar-date" id="today-date"></div>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main id="page-content" class="page-content">
        <div class="loading-page">
          <div class="spinner"></div>
          <p>جاري التحميل...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- ==================== MODAL ==================== -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-box" class="modal-box">
      <div id="modal-header" class="modal-header">
        <h3 id="modal-title">عنوان</h3>
        <button id="modal-close" class="modal-close-btn">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ==================== PRINT FRAME ==================== -->
  <iframe id="print-frame" style="display:none;"></iframe>

  <!-- ==================== TOASTS ==================== -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- JS Entry -->
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
